<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camera Capture or Upload Image</title>
    <style>
      .image-container {
        display: flex;
        justify-content: center;
        margin-top: 20px;
      }
      .image-box {
        width: 400px;
        height: 400px;
        border: 1px solid #ddd;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }
      .video-preview {
        display: none;
        width: 100%;
        height: 100%;
      }
      .arrow-button {
        margin: 10px;
        padding: 10px 20px;
        background-color: rgb(11, 138, 166);
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="image-container">
      <div class="image-box" id="imageBox">
        <video id="video" class="video-preview" autoplay></video>
      </div>
    </div>

    <div class="buttons" style="text-align: center;">
      <input type="file" id="uploadImage" accept="image/*" onchange="loadImage(event)" />
      <button class="arrow-button" onclick="startCamera()">打开摄像头</button>
      <button class="arrow-button" onclick="captureImage()">拍摄照片</button>
    </div>

    <script>
      let videoStream = null;
      let capturedImage = null;

      function loadImage(event) {
        const reader = new FileReader();
        reader.onload = function () {
          const img = new Image();
          img.src = reader.result;
          const imageBox = document.getElementById('imageBox');
          imageBox.innerHTML = '';
          imageBox.appendChild(img);
        };
        reader.readAsDataURL(event.target.files[0]);
      }

      async function startCamera() {
        try {
          videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
          const video = document.getElementById('video');
          video.srcObject = videoStream;
          video.style.display = 'block';
        } catch (error) {
          console.error('无法打开摄像头:', error);
          alert('请检查摄像头权限或设备连接');
        }
      }

      function captureImage() {
        const video = document.getElementById('video');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageBox = document.getElementById('imageBox');
        imageBox.innerHTML = ''; // 清空现有内容
        const img = new Image();
        img.src = canvas.toDataURL('image/png');
        imageBox.appendChild(img);

        // 停止视频流
        videoStream.getTracks().forEach(track => track.stop());
        video.style.display = 'none';
      }
    </script>
  </body>
</html>
